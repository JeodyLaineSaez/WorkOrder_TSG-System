{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}Edit Office{% endblock %}
{% block content %}
<div class="container mt-4">
    <h3>Edit Office</h3>
    <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" class="btn btn-success">Save Changes</button>
        <a href="{% url 'manage_offices' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
